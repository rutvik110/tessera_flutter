[package]
name = "tessera_flutter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
# Local checkout of https://github.com/theiskaa/tessera, cloned beside this plugin.
tessera = { path = "../../tessera/tessera", features = ["markdown"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
